<rect x="234" y="152" width="227" height="98" rx="12" fill="#DCE9FF" stroke="#4A86E8" stroke-width="2.6"/>
<text x="347.5" y="196.5" font-size="15.5" fill="#14284B" text-anchor="middle">Caller phones the studio</text>
<text x="347.5" y="215.5" font-size="15.5" fill="#14284B" text-anchor="middle">number, any hour</text>
<rect x="489" y="152" width="227" height="98" rx="12" fill="#DCE9FF" stroke="#4A86E8" stroke-width="2.6"/>
<text x="602.5" y="187" font-size="15.5" fill="#14284B" text-anchor="middle">Caller's spoken details:</text>
<text x="602.5" y="206" font-size="15.5" fill="#14284B" text-anchor="middle">name, area, size, scope,</text>
<text x="602.5" y="225" font-size="15.5" fill="#14284B" text-anchor="middle">timeline</text>
<rect x="744" y="274" width="227" height="98" rx="12" fill="#E6DBFA" stroke="#7B52D6" stroke-width="2.6"/>
<text x="857.5" y="309" font-size="15.5" fill="#14284B" text-anchor="middle">Prompt and knowledge files</text>
<text x="857.5" y="328" font-size="15.5" fill="#14284B" text-anchor="middle">from GitHub (services, area,</text>
<text x="857.5" y="347" font-size="15.5" fill="#14284B" text-anchor="middle">process). No prices.</text>
<rect x="1254" y="274" width="227" height="98" rx="12" fill="#E6DBFA" stroke="#7B52D6" stroke-width="2.6"/>
<text x="1367.5" y="309" font-size="15.5" fill="#14284B" text-anchor="middle">Qualifies with 5 checks.</text>
<text x="1367.5" y="328" font-size="15.5" fill="#14284B" text-anchor="middle">English, Hindi, Marathi.</text>
<text x="1367.5" y="347" font-size="15.5" fill="#14284B" text-anchor="middle">Never states a price.</text>
<rect x="999" y="396" width="227" height="98" rx="12" fill="#CFEFE9" stroke="#1FA58E" stroke-width="2.6"/>
<text x="1112.5" y="431" font-size="15.5" fill="#14284B" text-anchor="middle">Books the consultation.</text>
<text x="1112.5" y="450" font-size="15.5" fill="#14284B" text-anchor="middle">Round-robin picks the</text>
<text x="1112.5" y="469" font-size="15.5" fill="#14284B" text-anchor="middle">designer.</text>
<rect x="234" y="518" width="227" height="98" rx="12" fill="#FFF0C2" stroke="#E0A100" stroke-width="2.6"/>
<text x="347.5" y="553" font-size="15.5" fill="#14284B" text-anchor="middle">Vaani end-of-call event</text>
<text x="347.5" y="572" font-size="15.5" fill="#14284B" text-anchor="middle">arrives (secret in the</text>
<text x="347.5" y="591" font-size="15.5" fill="#14284B" text-anchor="middle">web address)</text>
<rect x="489" y="518" width="227" height="98" rx="12" fill="#FFF0C2" stroke="#E0A100" stroke-width="2.6"/>
<text x="602.5" y="553" font-size="15.5" fill="#14284B" text-anchor="middle">Transcript and extracted</text>
<text x="602.5" y="572" font-size="15.5" fill="#14284B" text-anchor="middle">fields: name, area,</text>
<text x="602.5" y="591" font-size="15.5" fill="#14284B" text-anchor="middle">outcome...</text>
<rect x="744" y="518" width="227" height="98" rx="12" fill="#FFF0C2" stroke="#E0A100" stroke-width="2.6"/>
<text x="857.5" y="553" font-size="15.5" fill="#14284B" text-anchor="middle">Caller's number and cost</text>
<text x="857.5" y="572" font-size="15.5" fill="#14284B" text-anchor="middle">from Vaani; booking</text>
<text x="857.5" y="591" font-size="15.5" fill="#14284B" text-anchor="middle">matched by phone</text>
<rect x="999" y="518" width="227" height="98" rx="12" fill="#FFF0C2" stroke="#E0A100" stroke-width="2.6"/>
<text x="1112.5" y="553" font-size="15.5" fill="#14284B" text-anchor="middle">Routes by outcome.</text>
<text x="1112.5" y="572" font-size="15.5" fill="#14284B" text-anchor="middle">Retries 3 times, flags</text>
<text x="1112.5" y="591" font-size="15.5" fill="#14284B" text-anchor="middle">any failure.</text>
<rect x="1509" y="518" width="227" height="98" rx="12" fill="#FFFFFF" stroke="#E5483A" stroke-width="2.6"/>
<text x="1622.5" y="553" font-size="15.5" fill="#14284B" text-anchor="middle">Dashboard (sign-in): Home,</text>
<text x="1622.5" y="572" font-size="15.5" fill="#14284B" text-anchor="middle">Calls, Reports, Settings.</text>
<text x="1622.5" y="591" font-size="15.5" fill="#14284B" text-anchor="middle">Weekly summary email.</text>
<rect x="999" y="640" width="227" height="98" rx="12" fill="#D3EFD8" stroke="#2E9E4F" stroke-width="2.6"/>
<text x="1112.5" y="675" font-size="15.5" fill="#14284B" text-anchor="middle">Neon saves the raw</text>
<text x="1112.5" y="694" font-size="15.5" fill="#14284B" text-anchor="middle">payload, outcome</text>
<text x="1112.5" y="713" font-size="15.5" fill="#14284B" text-anchor="middle">and cost.</text>
<rect x="1509" y="640" width="227" height="98" rx="12" fill="#D3EFD8" stroke="#2E9E4F" stroke-width="2.6"/>
<text x="1622.5" y="675" font-size="15.5" fill="#14284B" text-anchor="middle">HubSpot: contact, deal</text>
<text x="1622.5" y="694" font-size="15.5" fill="#14284B" text-anchor="middle">and note. No duplicate</text>
<text x="1622.5" y="713" font-size="15.5" fill="#14284B" text-anchor="middle">contacts.</text>
<rect x="1509" y="762" width="227" height="98" rx="12" fill="#FADBE7" stroke="#D6457F" stroke-width="2.6"/>
<text x="1622.5" y="797" font-size="15.5" fill="#14284B" text-anchor="middle">Resend sends handoff</text>
<text x="1622.5" y="816" font-size="15.5" fill="#14284B" text-anchor="middle">note, alerts, summary,</text>
<text x="1622.5" y="835" font-size="15.5" fill="#14284B" text-anchor="middle">sign-in links.</text>
<rect x="1509" y="884" width="227" height="98" rx="12" fill="#FFFFFF" stroke="#E5483A" stroke-width="2.6"/>
<text x="1622.5" y="919" font-size="15.5" fill="#14284B" text-anchor="middle">Designer: handoff note.</text>
<text x="1622.5" y="938" font-size="15.5" fill="#14284B" text-anchor="middle">Nikhil: urgent alerts.</text>
<text x="1622.5" y="957" font-size="15.5" fill="#14284B" text-anchor="middle">Front desk: leads.</text>
<text x="30" y="1036" font-size="16" fill="#5B6578">Dashed arrows follow one call from the phone ring to the people who act on it. Red boxes are what the studio sees.</text>
</svg>
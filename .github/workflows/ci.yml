name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No price figures in /agent
        run: npm run check:no-prices
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
